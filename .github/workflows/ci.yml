name: Public edition checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.15.0'
      - run: python -m pip install --target .deps -r requirements.txt
      - run: npm ci
      - run: npm audit --audit-level=low
      - run: python -B -m unittest discover -s tests
      - run: npm run test:graph
      - run: npm run build
      - run: python tools/check_public.py
      - run: npm run test:browser
      - run: python tools/package_public.py
      - run: python tools/verify_public.py releases/Trace-Qlik-Lineage-Public-Windows-x64-v0.1.2.zip
      - uses: actions/upload-artifact@v4
        with:
          name: public-edition-candidate
          path: |
            releases/*.zip
            releases/*.sha256
          if-no-files-found: error
          retention-days: 7
